<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Random Image Slideshow</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: black;
      color: white;
      font-family: sans-serif;
    }
    img {
      max-width: 90%;
      max-height: 70vh;
      margin: 20px 0;
      border: 2px solid white;
      cursor: pointer;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>Random Image Slideshow</h1>

<img id="random-img" src="48ef2ad2c5612eef59d5a3185b9e4c1ec4a3ab40ee02dcd207dd79eac9762aa6.jpeg" alt="Random Image">

<label for="interval">Interval (seconds): </label>
<input type="number" id="interval" value="5" min="1">
<button onclick="setNewInterval()">Set Interval</button>

<script>
const images = [
  "48ef2ad2c5612eef59d5a3185b9e4c1ec4a3ab40ee02dcd207dd79eac9762aa6.jpeg",
  "9fa0e769077aa701ba6c31a22862bab421bdcbfbe3d9c1457a6e16799eac0a34.jpeg",
  "asds.jpeg",
  "c7decb8fec9d9b59314e24ad9ec6137d8bce2f86a9d62e1f11646c93353aed8a.jpeg"
];

let intervalId;

function changeImage() {
  const randomIndex = Math.floor(Math.random() * images.length);
  document.getElementById("random-img").src = images[randomIndex];
}

// Start slideshow with specified interval
function startSlideshow(seconds) {
  if (intervalId) clearInterval(intervalId);
  intervalId = setInterval(changeImage, seconds * 1000);
}

// Set new interval from input
function setNewInterval() {
  const seconds = parseFloat(document.getElementById("interval").value);
  if (!isNaN(seconds) && seconds > 0) {
    startSlideshow(seconds);
  } else {
    alert("Please enter a valid number greater than 0.");
  }
}

// Manual change on click/tap
document.getElementById("random-img").addEventListener("click", changeImage);

// Initialize slideshow
startSlideshow(5);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Image Timer</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0e0e0e;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    img {
      max-width: 90%;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    img.visible {
      opacity: 1;
    }

    .controls {
      margin-top: 15px;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input {
      width: 80px;
      text-align: center;
      font-size: 16px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #222;
      color: white;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      img {
        max-width: 100%;
      }
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <img id="randomImage" src="" alt="Random image">

  <div class="controls">
    <label for="timeInput">Change every (seconds):</label>
    <input type="number" id="timeInput" value="5" min="1">
  </div>

  <script>
    // ✅ Use your actual image file names from the GitHub "images" folder
    const images = [
      "images/48ef2ad2c5612eef59d5a3185b9e4c1ec4a3ab40ee02dcd207dd79eac9762aa6.jpeg",
      "images/9fa0e769077aa701ba6c31a22862bab421bdcbfbe3d9c1457a6e16799eac0a34.jpeg",
      "images/asds.jpeg",
      "images/c7decb8fec9d9b59314e24ad9ec6137d8bce2f86a9d62e1f11646c93353aed8a.jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(1).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(2).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(3).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(4).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(5).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(6).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(7).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(8).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac(9).jpeg",
      "images/cfd4758381b3b1f694f122ec3dd9944da37a4b0c44842af7825606f33d889eac.jpeg",
      "images/mgppkbkg1r58i3.jpeg",
      "images/mgppkn65wqags3.jpeg",
      "images/mgpplmzie2v3rd.jpeg",
      "images/mgpq2fe0uprm0p.jpeg",
      "images/mgpq2ga43hv2lz.jpeg",
      "images/mgpqa0tjr461r7.jpeg",
      "images/mgpqezgbwxjzol.jpeg",
      "images/mgto6dugeka4jj.jpeg",
      "images/mgtodfxt74foge.jpeg",
      "images/mgtonu6s4vqd1d.jpeg",
      "images/mgtouormpx9h48.jpeg",
      "images/mgtp557tlm0wvx.jpeg",
      "images/mgtpdbivem3pg9(1).jpeg",
      "images/mgtpdbivem3pg9.jpeg",
      "images/mgtrquodngvqxe.jpeg",
      "images/mgtrqzex9t4f4k.jpeg",
      "images/mgtru4akjt8sp1.jpeg",
      "images/qv9j32s5wauf1.gif"
    ];

    const imgElement = document.getElementById("randomImage");
    const timeInput = document.getElementById("timeInput");
    let timer;

    function showRandomImage() {
      const randomIndex = Math.floor(Math.random() * images.length);
      const newImage = images[randomIndex];

      imgElement.classList.remove("visible"); // fade out
      setTimeout(() => {
        imgElement.src = newImage;
        imgElement.classList.add("visible"); // fade in
      }, 300);
    }

    function startTimer() {
      clearInterval(timer);
      const seconds = parseInt(timeInput.value);
      timer = setInterval(showRandomImage, seconds * 1000);
    }

    imgElement.addEventListener("click", showRandomImage);
    timeInput.addEventListener("change", startTimer);
    imgElement.addEventListener("load", () => imgElement.classList.add("visible"));

    // Initialize
    showRandomImage();
    startTimer();
  </script>
</body>
</html>
